services:
  # Backend API Service (FastAPI)
  - type: web
    name: airscope-backend
    runtime: python
    rootDir: backend
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: DATABASE_URL
        value: sqlite:///./airq.db
      - key: ALLOWED_ORIGINS
        sync: false # Set in dashboard to your frontend URL

  # Frontend Web UI (React + Vite SPA)
  - type: web
    name: airscope-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set in dashboard to your airscope-backend https:// URL
